<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maria's English Game</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="style.js"></script>
<link rel="stylesheet" href="code.css">
</head>
<body>
<div class="blobs"><div class="bl"></div><div class="bl"></div><div class="bl"></div></div>

<div id="loginPage">
    <div class="lcard">
    <div class="llogo">Maria<span>Vocab</span></div>
    <div class="lsub">Interactive English Learning Platform</div>
    <div class="ltabs">
        <button class="ltab on" data-t="login">Login</button>
        <button class="ltab" data-t="register">Register</button>
    </div>
    <form id="loginForm">
        <div class="lfield"><label>Username</label><input type="text" id="lUser" placeholder="Enter Username" autocomplete="username"></div>
        <div class="lfield"><label>Password</label><input type="password" id="lPass" placeholder="Create password" autocomplete="current-password"><button class="eye" type="button" data-target="lPass" aria-label="Tampilkan Pasword"><i class="fas fa-eye"></i></button></div>
        <div class="lerr" id="lErr"></div>
        <button type="button" class="lbtn" id="lBtn">Login</button>
    </form>
    <form id="regForm" style="display:none">
        <div class="lfield"><label>Username</label><input type="text" id="rUser" placeholder="Create username (min 3 Characters)" autocomplete="username"></div>
        <div class="lfield"><label>Password</label><input type="password" id="rPass" placeholder="create password (min 4 characters)" autocomplete="new-password"><button class="eye" type="button" data-target="rPass"><i class="fas fa-eye"></i></button></div>
        <div class="lfield"><label>Confirm Password</label><input type="password" id="rConf" placeholder="Repeat password" autocomplete="new-password"></div>
        <div class="lerr" id="rErr"></div>
        <button type="button" class="lbtn" id="rBtn">Create Account</button>
    </form>
    <div class="lnote"><i class="fas fa-lock" style="margin-right:4px"></i>Your Progress is saved automatically in this browser</div>
    </div>
</div>

<div id="appPage" style="display:none">
    <header class="app-h">
    <div class="hlogo">Maria's<span>Master</span></div>
    <div class="hright">
        <div class="hxp"><i class="fas fa-star"></i><span id="hXp">0</span></div>
        <div class="hstreak"><i class="fas fa-fire"></i><span id="hSt">0</span></div>
        <div class="huser" id="hUser">User</div>
        <button class="hout" id="hOut" aria-label="Keluar"><i class="fas fa-sign-out-alt"></i></button>
    </div>
    </header>
    <main class="app-m">
    <div id="vDash" class="view on"></div>
    <div id="vQuiz" class="view"></div>
    <div id="vMatch" class="view"></div>
    <div id="vError" class="view"></div>
    </main>
</div>

<div class="toasts" id="toasts"></div>

</body>
</html>
